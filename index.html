<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الزوايا — تحديد العلاقة بين زاويتين</title>
<script>
/* Apply saved theme before CSS loads (no flash). Offline-safe. */
try {
  if (localStorage.getItem("angles-theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="sheet-header">
  <div class="head-row">
    <div class="person student"><span class="label">اسم الطالب:</span><br><strong>مصطفى عبد الباسط زهرا</strong></div>
    <img src="logo.png" alt="شعار مدارس المتقدمة" class="logo">
    <div class="person teacher"><span class="label">اسم المعلم:</span><br><strong>محمد عبد الله</strong></div>
  </div>
  <h1>تحديد العلاقة بين زاويتين</h1>
  <button id="themeToggle" type="button">الوضع الداكن</button>
</header>

<main>
  <p class="hint">المس زاويتين من الشكل لعرض العلاقة بينهما.</p>

       Tap circles (r=24) sit on the measured numeral positions. -->
  <svg id="figure" viewBox="0 0 763 644" role="group" aria-label="الشكل الهندسي: المستقيمان r و s يقطعهما القاطع t، والمستقيم v">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0072BC" />
      </marker>
    </defs>
    <!-- Lines (blue, arrows both ends, as in figure.png) -->
    <line x1="123" y1="238" x2="647" y2="238" class="beam" marker-start="url(#arr)" marker-end="url(#arr)" />
    <line x1="316" y1="66" x2="222" y2="641" class="beam" marker-start="url(#arr)" marker-end="url(#arr)" />
    <line x1="408" y1="47" x2="548" y2="620" class="beam" marker-start="url(#arr)" marker-end="url(#arr)" />
    <line x1="125" y1="575" x2="646" y2="378" class="beam" marker-start="url(#arr)" marker-end="url(#arr)" />
    <!-- Line labels (as in figure.png) -->
    <text x="105" y="218" class="linelabel">t</text>
    <text x="322" y="40" class="linelabel" text-anchor="middle">r</text>
    <text x="411" y="28" class="linelabel" text-anchor="middle">s</text>
    <text x="136" y="550" class="linelabel" text-anchor="middle">v</text>
    <!-- Tappable angles: invisible circle + black numeral -->
    <g class="angle" data-angle="1" tabindex="0" role="button" aria-label="الزاوية 1">
      <circle cx="271" cy="197" r="24"/><text x="271" y="197" class="numlabel" dy=".35em">1</text>
    </g>
    <g class="angle" data-angle="2" tabindex="0" role="button" aria-label="الزاوية 2">
      <circle cx="319" cy="197" r="24"/><text x="319" y="197" class="numlabel" dy=".35em">2</text>
    </g>
    <g class="angle" data-angle="5" tabindex="0" role="button" aria-label="الزاوية 5">
      <circle cx="310" cy="267" r="24"/><text x="310" y="267" class="numlabel" dy=".35em">5</text>
    </g>
    <g class="angle" data-angle="3" tabindex="0" role="button" aria-label="الزاوية 3">
      <circle cx="416" cy="197" r="24"/><text x="416" y="197" class="numlabel" dy=".35em">3</text>
    </g>
    <g class="angle" data-angle="4" tabindex="0" role="button" aria-label="الزاوية 4">
      <circle cx="476" cy="197" r="24"/><text x="476" y="197" class="numlabel" dy=".35em">4</text>
    </g>
    <g class="angle" data-angle="6" tabindex="0" role="button" aria-label="الزاوية 6">
      <circle cx="487" cy="267" r="24"/><text x="487" y="267" class="numlabel" dy=".35em">6</text>
    </g>
    <g class="angle" data-angle="7" tabindex="0" role="button" aria-label="الزاوية 7">
      <circle cx="273" cy="483" r="24"/><text x="273" y="483" class="numlabel" dy=".35em">7</text>
    </g>
    <g class="angle" data-angle="10" tabindex="0" role="button" aria-label="الزاوية 10">
      <circle cx="196" cy="582" r="24"/><text x="196" y="582" class="numlabel" dy=".35em">10</text>
    </g>
    <g class="angle" data-angle="8" tabindex="0" role="button" aria-label="الزاوية 8">
      <circle cx="469" cy="406" r="24"/><text x="469" y="406" class="numlabel" dy=".35em">8</text>
    </g>
    <g class="angle" data-angle="9" tabindex="0" role="button" aria-label="الزاوية 9">
      <circle cx="517" cy="386" r="24"/><text x="517" y="386" class="numlabel" dy=".35em">9</text>
    </g>
    <g class="angle" data-angle="11" tabindex="0" role="button" aria-label="الزاوية 11">
      <circle cx="477" cy="478" r="24"/><text x="477" y="478" class="numlabel" dy=".35em">11</text>
    </g>
    <g class="angle" data-angle="12" tabindex="0" role="button" aria-label="الزاوية 12">
      <circle cx="541" cy="451" r="24"/><text x="541" y="451" class="numlabel" dy=".35em">12</text>
    </g>
  </svg>

  <div class="selection-row">
    <div id="selection">لم تُختر أي زاوية بعد.</div>
    <button id="reset" type="button">مسح الاختيار</button>
  </div>

  <div id="result" aria-live="polite"></div>
</main>

<script src="logic.js"></script>
